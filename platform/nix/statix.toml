# Конфигурация statix для nix-конфигов репозитория.
#
# repeated_keys отключён осознанно. Правило ловит `a.b = …; a.c = …;` и
# предлагает свести их в один `a = { b = …; c = …; }`. Для прикладного кода это
# верно, для модуля nix-darwin — нет: здесь `system.activationScripts`,
# `system.defaults` и `system.stateVersion` разнесены на сотни строк и стоят
# рядом с тем, к чему относятся по смыслу (чистка Caskroom — рядом с блоком
# homebrew, а не в общем `system`). Слияние собрало бы в одну кучу настройки
# дока, клавиатуры и активационные скрипты и оторвало бы каждую от её
# комментария. То же в home/darwin.nix: `home.file` и `home.activation` — это
# «какие симлинки» и «что выполнить», разные разделы.
#
# Остальные правила включены; deadnix и nixfmt проверяются отдельно.
disabled = ["repeated_keys"]
