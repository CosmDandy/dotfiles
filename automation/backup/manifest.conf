# What gets backed up. Kept separate from the logic, so adding a path never means touching
# backup.sh. One encrypted restic repository for everything: restic encrypts client-side,
# so data and secrets (ssh keys, .env) travel together safely.
#
# EXCLUDES are restic --exclude patterns and apply to every path.

BACKUP_PATHS=(
  "$HOME/KnowledgeBase"          # Obsidian vault
  "$HOME/Documents"              # books, personal documents
  "$HOME/Projects"               # including design notes that have been lost before
  "$HOME/Work"
  "$HOME/Recordings"             # call recordings, used by the c-call skill
  "$HOME/.ssh"                   # private keys
  "$HOME/.local/share/atuin/key" # atuin's E2E key, unrecoverable
  "$HOME/.dotfiles/.env"
  # BetterDisplay settings: not kept in the repo (EDID, serials, licence marker)
  "$HOME/Library/Preferences/pro.betterdisplay.BetterDisplay.plist"
  # Spokenly dictation history: 13k+ recordings of my own speech, material for later
  # analysis. A single copy that exists nowhere else.
  "$HOME/Library/Application Support/Spokenly/History"
  # Arc's Favorites reference and state snapshots — without them there is nothing to repair
  # the browser with after a reinstall.
  "$HOME/Backups/arc"
  # NOTE: ~/.claude/projects is deliberately NOT here — the valuable half, the memory, is
  # versioned in tools/claude/custom/knowledge, and the rest is session transcripts that
  # grow by gigabytes and are worthless once the knowledge is extracted.
  # NOTE: Music, Movies and Pictures are deliberately out too — media survives a reinstall
  # on external storage or in photo cloud, and here it would add tens of gigabytes.
)

EXCLUDES=(
  ".DS_Store"
  "node_modules"
  ".venv"
  "__pycache__"
  "*.pyc"
  ".terraform"
  ".devpod"
  "*.before-dotfiles"
)
