disableStartupPopups: true
notARepository: skip
gui:
  skipDiscardChangeWarning: true
  skipStashWarning: true
  skipNoStagedFilesWarning: true
  skipRewordInEditorWarning: true
  showFileTree: true
  border: rounded
  showBottomLine: false
  showCommandLog: false
  nerdFontsVersion: "3"
  showFileIcons: false
  theme:
    # cyan, а не blue: «где сейчас ввод» во всём стеке помечено бирюзовым —
    # тем же цветом, что курсор ghostty (#2aa198). Синий тут выбивался из
    # общей схемы. (Раньше в этот же ряд входила рамка активного окна от
    # jankyborders — её убрали вместе с отступами aerospace.)
    activeBorderColor:
      - '#2aa198'
      - bold
    inactiveBorderColor:
      - '#586e75'
    optionsTextColor:
      - '#268bd2'
    unstagedChangesColor:
      - '#dc322f'
git:
  overrideGpg: True
  autoFetch: true
  # По умолчанию delta — обычный построчный дифф. difftastic остался вторым, на
  # клавише `|`: это НЕ смена оформления, а смена алгоритма — delta рисует
  # построчный дифф от git, difftastic парсит оба файла через tree-sitter и
  # сравнивает синтаксические деревья. Он выигрывает там, где форматтер сдвинул
  # соседние строки, и в IaC это вылезает постоянно:
  #   • terraform fmt выравнивает `=` по колонке, поэтому один добавленный
  #     параметр с длинным именем переписывает все соседние строки. git покажет
  #     весь блок изменённым, difftastic — только новые строки (проверено:
  #     4 удаления + 6 добавлений против 2 добавлений);
  #   • обёртка тасков ansible в block: сдвигает отступ у всех вложенных;
  #   • то же на go и zig, когда тело оборачивается в if err != nil / errdefer.
  #
  # externalDiffCommand, а НЕ pager: ключи взаимоисключающие, и difftastic
  # физически не может быть пейджером — он не читает unified diff со stdin
  # (печатает свою справку), ему нужны два пути к файлам. lazygit это умеет:
  # `git.pagers[N]: at most one of 'pager', 'externalDiffCommand', and
  # 'useExternalDiffGitConfig' may be set` — строка из бинаря 0.63.1.
  #
  # --display inline, а не side-by-side: панель lazygit узкая, на 13" экране
  # (и особенно во float внутри nvim) две колонки не помещаются — ровно та же
  # причина, по которой у delta были выключены номера строк.
  # Номера строк difftastic печатает сам, двумя узкими колонками (старый номер
  # и новый), выключить их нельзя — но они по 2–4 символа, а не по 11, как было
  # у delta.
  #
  # Собственного пейджера у difftastic нет, поэтому аналог --paging=never не
  # нужен: прокруткой панели занимается сам lazygit.
  # Яркость под фон терминала — в theme-{light,dark}.yml (обёртка lg в
  # conf.d/lg.zsh, внутри nvim — snacks-git.lua по vim.o.background).
  #
  # ДВА рендерера, переключение клавишей `|` (cyclePagers) прямо в панели.
  # Первый в списке активен по умолчанию — это delta: обычный вид основной,
  # difftastic под рукой на те диффы, где формат сдвинул соседние строки.
  # Когда решение принято — лишний элемент удаляется, вместе с этим абзацем.
  # Настройки delta сохранены ровно те, что были выверены: номера строк
  # выключены (на 13" и во float внутри nvim колонки съедали ширину),
  # --paging=never (свой пейджер сломал бы прокрутку панели), --wrap-max-lines 0
  # (обрезать длинные строки, а не переносить с маркером ↵).
  diffRenderers:
    - colorArg: always
      command: "delta --paging=never --wrap-max-lines 0 --file-style='#248d83 bold' --file-decoration-style='#586e75 ul' --hunk-header-style=omit --hyperlinks"
    - colorArg: always
      command: "difft --color=always --display=inline"
      type: extDiff
  mainBranches:
    # master оставлен: конфиг общий для всех репозиториев, а рабочие (kvt-*)
    # на GitLab по-прежнему живут на master/develop
    - main
    - master
    - stage
    - develop
  log:
    showGraph: always
os:
  editPreset: nvim
