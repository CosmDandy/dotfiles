# Overlay for a light terminal background, applied by the lg wrapper.
gui:
  theme:
    selectedLineBgColor:
      - '#eee8d5'
git:
  # NOTE: as in theme-dark.yml — diffRenderers is replaced wholesale, not merged, so the
  # line is repeated here with the light palette.
  diffRenderers:
    - colorArg: always
      command: "delta --paging=never --wrap-max-lines 0 --file-style='#248d83 bold' --file-decoration-style='#586e75 ul' --hunk-header-style=omit --hyperlinks --light --syntax-theme='Solarized (light)' --minus-style='syntax #f6d0c4' --plus-style='syntax #e3ecc8'"
