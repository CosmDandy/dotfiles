# Оверлей для светлого фона терминала (см. обёртку lg в tools/zsh/conf.d/lg.zsh).
gui:
  theme:
    selectedLineBgColor:
      - '#eee8d5'
git:
  # См. комментарий в theme-dark.yml: список pagers повторяется целиком, оба
  # элемента, иначе переключать клавишей `|` будет нечего.
  pagers:
    - colorArg: always
      externalDiffCommand: "difft --color=always --display=inline --background=light"
    - colorArg: always
      pager: "delta --paging=never --wrap-max-lines 0 --file-style='#248d83 bold' --file-decoration-style='#586e75 ul' --hunk-header-style=omit --hyperlinks --light --syntax-theme='Solarized (light)' --minus-style='syntax #f6d0c4' --plus-style='syntax #e3ecc8'"
