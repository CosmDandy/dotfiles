# Оверлей для тёмного фона терминала (см. обёртку lg в tools/zsh/conf.d/lg.zsh).
gui:
  theme:
    selectedLineBgColor:
      - '#073642'
git:
  # pagers, не paging: ключ сменился в lazygit (0.63.1 печатает `pagers: []`).
  # Строка повторяется целиком — lazygit подменяет ключ при наложении
  # конфигов, а не сливает. Отличие от config.yml — только цвета под фон.
  pagers:
    - colorArg: always
      pager: "delta --paging=never --line-numbers --file-style='#248d83 bold' --file-decoration-style='#586e75 ul' --line-numbers-left-style='#248d83' --line-numbers-right-style='#248d83' --hunk-header-style=omit --line-numbers-left-format='{nm:>4} ' --line-numbers-right-format='{np:>4}  ' --line-numbers-minus-style='#dc322f' --line-numbers-plus-style='#859900' --hyperlinks --dark --syntax-theme='Solarized (dark)' --line-numbers-zero-style='#657b83' --minus-style='syntax #4a2a24' --plus-style='syntax #24482e'"
