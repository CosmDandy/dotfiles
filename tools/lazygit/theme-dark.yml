# Оверлей для тёмного фона терминала (см. обёртку lg в tools/zsh/conf.d/lg.zsh).
gui:
  theme:
    selectedLineBgColor:
      - '#073642'
git:
  # pagers, не paging: ключ сменился в lazygit (0.63.1 печатает `pagers: []`).
  # Строка повторяется целиком — lazygit подменяет ключ при наложении
  # конфигов, а не сливает. Отличие от config.yml — только --background.
  #
  # У difftastic нет посимвольной настройки стилей, как была у delta
  # (--minus-style/--plus-style со своими hex): он берёт встроенную палитру и
  # лишь подбирает яркость под фон. Поэтому у него одна опция вместо четырёх.
  #
  # Оба пейджера повторяются и здесь: список подменяется целиком, а не
  # сливается поэлементно — оставь тут один, и клавиша `|` переключать будет
  # нечего. Порядок тот же, что в config.yml: difftastic активен по умолчанию.
  pagers:
    - colorArg: always
      externalDiffCommand: "difft --color=always --display=inline --background=dark"
    - colorArg: always
      pager: "delta --paging=never --wrap-max-lines 0 --file-style='#248d83 bold' --file-decoration-style='#586e75 ul' --hunk-header-style=omit --hyperlinks --dark --syntax-theme='Solarized (dark)' --minus-style='syntax #4a2a24' --plus-style='syntax #24482e'"
