# Overlay for a dark terminal background, applied by the lg wrapper.
gui:
  theme:
    selectedLineBgColor:
      - '#073642'
git:
  # NOTE: the whole line is repeated because lazygit REPLACES the key when overlaying
  # configs rather than merging it. The only difference from config.yml is the palette.
  diffRenderers:
    - colorArg: always
      command: "delta --paging=never --wrap-max-lines 0 --file-style='#248d83 bold' --file-decoration-style='#586e75 ul' --hunk-header-style=omit --hyperlinks --dark --syntax-theme='Solarized (dark)' --minus-style='syntax #4a2a24' --plus-style='syntax #24482e'"
