add_newline = false
palette = "solarized"
# An explicit list instead of $all: a module not named here is never even
# probed. $all ran every language module, and nodejs alone spawned
# `node --version` on each prompt in any directory holding a .js file — 9 of
# 14.6 ms in a devpod. Order follows starship's default; a new tool gets added
# here on purpose, never by a starship upgrade.
# ${env_var.STARSHIP_VM} opens the second line next to the container icon, and
# $shlvl sits right before $character so nesting reads as extra arrows: ❯❯.
format = """\
$username$hostname$kubernetes$directory$git_branch$git_commit$git_state\
$docker_context$golang$helm$python$rust$terraform$nix_shell\
$aws$gcloud$azure$direnv$cmd_duration$line_break\
$jobs$battery$status$container${env_var.STARSHIP_VM}$shlvl$character"""

# SHLVL counts from the tmux pane, not from the tmux server: .zshrc resets it to 1
# in each pane's first shell, so threshold 2 means "a shell inside a shell".
[shlvl]
disabled = false
threshold = 2
repeat = true
repeat_offset = 1
symbol = '❯'
style = 'bold yellow'
format = '[$symbol]($style)'

[git_branch]
format = 'on [$branch(:$remote_branch)]($style) '

[git_status]
format = ''

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[status]
disabled = false
format = '[$status]($style) '

[username]
show_always = false
style_user = 'bold cyan'
style_root = 'bold red'
format = '[$user]($style) '

[hostname]
ssh_only = true
format = '[$hostname]($style) in '

[jobs]
symbol = '✦'
number_threshold = 1
format = '[$symbol$number]($style) '

[container]
symbol = '󰆧'
format = '[$symbol]($style) '

# VM badge without a fork: STARSHIP_VM is exported once per shell by
# tools/zsh/conf.d/tab-title.zsh, which already runs systemd-detect-virt at load
# (set only inside a VM, never in a container). The previous custom.vm ran
# `bash -c 'systemd-detect-virt …'` on EVERY prompt — 9 of 23 ms on the devpod.
[env_var.STARSHIP_VM]
variable = 'STARSHIP_VM'
symbol = '󰒋'
format = '[$symbol]($style) '
style = 'bold yellow'

[python]
format = '[${symbol}(${version} )(\($virtualenv\))]($style) '
symbol = ' '

[golang]
format = '[$symbol($version )]($style) '
symbol = "\ue627 "

[rust]
format = '[$symbol($version )]($style) '
symbol = "\ue68b "

[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
symbol = '☸ '

# Production goes red. Every team names it differently, so one case-insensitive
# pattern covers them all; the name itself is shown as is.
# NOTE: starship wraps the pattern in ^…$ and its regex engine rejects (?i), so
# case is spelled out, and the outer group keeps the `|` inside the anchors.
# `live` needs a non-letter on both sides, or it would match delivery and olive.
[[kubernetes.contexts]]
context_pattern = '(.*(prod|prd|master|PROD|PRD|MASTER).*|(.*[^a-zA-Z])?(live|LIVE)([^a-zA-Z].*)?)'
style = 'bold red'

[terraform]
format = '[$symbol$workspace]($style) '
symbol = '󱁢 '

[docker_context]
format = '[$symbol$context]($style) '
only_with_files = true

[nix_shell]
format = '[$symbol$state]($style) '
symbol = ' '

[direnv]
disabled = false
symbol = ''
format = '[$allowed]($style) '
allowed_msg = ''
not_allowed_msg = '󰚄 allow'
denied_msg = '󰚄 denied'
style = 'bold yellow'

[helm]
format = '[$symbol($version )]($style) '

[aws]
format = '[$symbol($profile )(\($region\))]($style) '
symbol = ' '

[gcloud]
format = '[$symbol$project(\($region\))]($style) '
symbol = '󱇶 '

[azure]
disabled = false
format = '[$symbol($subscription )]($style) '
symbol = "\U000F0805 "

[battery]
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
unknown_symbol = '󰁽 '
empty_symbol = '󰂎 '

[[battery.display]]
threshold = 20
style = 'bold red'

[cmd_duration]
min_time = 3_000
format = '[$duration]($style) '
style = 'yellow'

# NOTE: the [sudo] block is deliberately absent — it was the most expensive module in the
# prompt (48 ms per `starship timings`) because it ran `sudo -n -v` before EVERY render, and
# almost always printed nothing. The module defaults to disabled, so its absence is the
# off state.

[palettes.solarized]
# Solarized accent colours, readable on both light and dark backgrounds
red     = "#dc322f"
orange  = "#cb4b16"
yellow  = "#b58900"
green   = "#859900"
cyan    = "#2aa198"
blue    = "#268bd2"
violet  = "#6c71c4"
magenta = "#d33682"
purple  = "#6c71c4"
# base tones (base03/02 dark, base2/3 light)
base03  = "#002b36"
base02  = "#073642"
base01  = "#586e75"
base00  = "#657b83"
base0   = "#839496"
base1   = "#93a1a1"
base2   = "#eee8d5"
base3   = "#fdf6e3"
