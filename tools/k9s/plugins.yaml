# k9s plugins.
# NOTE: shortcuts live on Ctrl-* so they do not collide with sorting (Shift-*) or with
# k9s's own keys. The binaries come from nix.
plugins:
  # image layer analysis; needs docker (OrbStack)
  dive:
    shortCut: Ctrl-Y
    description: Dive image
    scopes:
      - containers
    command: dive
    background: false
    args:
      - $COL-IMAGE

  # NOTE: no Flux plugins here — local-lab runs ArgoCD. Switching back means adding
  # `flux reconcile kustomization/helmrelease $NAME -n $NAMESPACE --context $CONTEXT`
  # entries on Ctrl-R and returning fluxcd to the devops profile.

  # needs `argocd login`
  argocd-sync:
    shortCut: Ctrl-O
    description: ArgoCD sync
    scopes:
      - applications
    command: argocd
    background: false
    confirm: true
    args:
      - app
      - sync
      - $NAME

  # debug shell on a node through netshoot (ephemeral container)
  node-debug:
    shortCut: Ctrl-G
    description: Node netshoot
    scopes:
      - nodes
    command: kubectl
    background: false
    args:
      - debug
      - node/$NAME
      - -it
      - --context
      - $CONTEXT
      - --image
      - nicolaka/netshoot:latest

  events:
    shortCut: Ctrl-V
    description: Watch events
    scopes:
      - pods
      - deployments
      - statefulsets
      - daemonsets
      - nodes
    command: bash
    background: false
    args:
      - -c
      - "kubectl get events -n $NAMESPACE --context $CONTEXT --field-selector involvedObject.name=$NAME -w"
