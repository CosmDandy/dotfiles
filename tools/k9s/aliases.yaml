# Custom short names for the : command only — k9s already understands the built-in
# kubectl/k9s shortnames (sts, ds, cm, sec, pvc, ing, crd, …) without an alias.
aliases:
  # Workloads
  dp: deployments
  # Network
  np: networkpolicies
  # RBAC has no kubectl shortnames
  ro: roles
  rb: rolebindings
  cr: clusterroles
  crb: clusterrolebindings
  # GitOps CRDs (Flux / ArgoCD)
  ks: kustomizations
  hr: helmreleases
  gitrepo: gitrepositories
  app: applications
  appproj: appprojects
