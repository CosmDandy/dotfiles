unbind r
bind-key -r r source-file ~/.tmux.conf

bind-key y select-pane -L
bind-key h select-pane -D
bind-key a select-pane -U
bind-key e select-pane -R

# Seamless nvim-split <-> tmux-pane navigation: if the active pane runs (n)vim
# the Ctrl-key is passed through, otherwise tmux moves the focus itself.
# NOTE: C-a/C-e/C-y are intercepted here in non-vim panes and no longer work as
# readline begin/end-of-line/yank.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)$'"
bind-key -n 'C-y' if-shell "$is_vim" 'send-keys C-y' 'select-pane -L'
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -D'
bind-key -n 'C-a' if-shell "$is_vim" 'send-keys C-a' 'select-pane -U'
bind-key -n 'C-e' if-shell "$is_vim" 'send-keys C-e' 'select-pane -R'
bind-key -T copy-mode-vi 'C-y' select-pane -L
bind-key -T copy-mode-vi 'C-h' select-pane -D
bind-key -T copy-mode-vi 'C-a' select-pane -U
bind-key -T copy-mode-vi 'C-e' select-pane -R

# Split panes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# prefix+R enters resize mode: y/h/a/e move the border, Escape leaves. No axis
# to pick — resize-pane -L/-R/-U/-D finds the right border in any grid.
# NOTE: the key table resets to root AFTER EVERY KEY, which is why
# `switch-client -T resize` is repeated at the end of each binding — without it
# the mode would be single-use.
# NOTE: an unbound key also drops to root AND IS SWALLOWED — it never reaches
# the pane (verified: pressing z in the mode delivers nothing). Forget Escape
# and the first character of the next command vanishes silently, which is what
# the status-right indicator below exists to prevent.
bind R switch-client -T resize
bind -T resize y resize-pane -L 3 \; switch-client -T resize
bind -T resize h resize-pane -D 3 \; switch-client -T resize
bind -T resize a resize-pane -U 3 \; switch-client -T resize
bind -T resize e resize-pane -R 3 \; switch-client -T resize
bind -T resize Escape display-message "resize off"

# prefix+j moves the pane running Claude Code between its own window and a split
# beside the current one — the same process, via join-pane/break-pane. Also
# reachable from nvim as :ClaudeCode through the plugin's tmux provider.
bind j run-shell '~/.dotfiles/tools/tmux/claude-pane.sh toggle #{pane_id}'

# Sessions

bind S command-prompt -p "New session:" "new-session -A -s '%%'"
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
bind L switch-client -l
# dynamic session menu with a direct hotkey jump
bind s run-shell '~/.dotfiles/tools/tmux/session-menu.sh'

# switch to another session instead of exiting tmux
set -g detach-on-destroy off

set-hook -g session-created "rename-session '#{s/^[.]//:#{b:pane_current_path}}'"

# SSH agent forwarding — update env on reattach
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

set -g prefix C-s
# keyboard-only; prefix+m is a deliberate temporary return
set -g mouse off
bind m set -g mouse \; display-message "mouse #{?mouse,on,off}"
set -g set-titles on
set -g set-titles-string '#(~/.dotfiles/tools/tmux/pane-title.sh #{pane_pid} #{pane_current_command} #S)'
set -g set-clipboard on
set -g allow-passthrough on
set -g history-limit 1000000

# Notifications

set -g monitor-activity off
set -g visual-activity off
set -g activity-action none

set -g monitor-bell on
set -g visual-bell off
set -g bell-action other
# NOTE: the bell sound is deliberately NOT here but in Ghostty. An afplay hook
# would only ever sound where afplay exists — the mac, never a dev container —
# although a BEL from a container reaches the same terminal. Doing it host-side
# covers both and drops a fork per bell. tmux keeps the window highlight via
# monitor-bell.
# NOTE: bell-action other means only INACTIVE windows signal. Deliberate, but it
# also means that in a container, where every event collapses to a BEL, the
# active window is silent.

# for neovim
set -sg escape-time 0
set -g focus-events on

# VI mode
set-window-option -g mode-keys vi
set -g status-keys vi

# NOTE: tmux's defaults disagree with vim — v is rectangle-toggle and
# begin-selection sits on Space, so muscle memory from nvim lies.
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Finishing a selection copies but does NOT leave copy-mode.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi y                 send-keys -X copy-selection
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection

# Enter is the deliberate way out of copy-mode; q, Escape and Ctrl-c also exit.
bind -T copy-mode-vi Enter  send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# prefix+P dumps the pane scrollback into nvim — copy-mode has no line numbers,
# and on a long traceback there is nothing to aim at. Opened at the last line,
# where the error is.
bind-key P run-shell 'tmux capture-pane -p -S -#{history_limit} -t #{pane_id} > /tmp/tmux-scrollback-#{pane_id}.txt; tmux new-window -n scrollback "nvim + /tmp/tmux-scrollback-#{pane_id}.txt"'

# Status bar
set -g status on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style bg=default

set -g status-left ''

# Three states, with the key-table check FIRST: once in the mode the client is
# no longer under the prefix, so the branch order is not cosmetic.
# NOTE: the mode colour is colour136 (Solarized yellow), not orange colour166 —
# orange sat next to the prefix's colour9 and was indistinguishable in
# peripheral vision. Muted rather than bright colour11, which is unreadable on
# the light theme.
set -g status-right '#{?#{==:#{client_key_table},resize},#[fg=colour136]#S #[fg=colour242]· #[fg=colour136]%H:%M ,#{?client_prefix,#[fg=colour9]#S #[fg=colour242]· #[fg=colour9]%H:%M ,#[fg=colour12]#S #[fg=colour242]· #[fg=default]%H:%M }}'

set -g window-status-current-format " ●#{?#{||:#{==:#{window_index},3},#{||:#{==:#{window_index},6},#{==:#{window_index},9}}}, ,}"
set -g window-status-current-style fg=colour9,bg=default

set -g window-status-format " ●#{?#{||:#{==:#{window_index},3},#{||:#{==:#{window_index},6},#{==:#{window_index},9}}}, ,}"
set -g window-status-style fg=colour242,bg=default

set -g window-status-bell-style fg=colour2,bg=default

set -g pane-border-style fg=colour242
set -g pane-active-border-style fg=colour166

set -g message-style fg=colour166,bg=default

set -g mode-style reverse

set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Terminal colors
set -g default-terminal "tmux-256color"
# NOTE: terminal-features, not terminal-overrides with a "*256col*" mask —
# outside tmux Ghostty sets TERM=xterm-ghostty, which does not match, so the
# override never applied. Truecolor worked anyway through Tc from terminfo, i.e.
# the line was dead on the mac and alive only in containers. A "*" mask does not
# depend on the TERM name.
# NOTE: verify with `tmux display -p '#{client_termfeatures}'`, NOT `tmux info`
# — the "RGB: [missing]" line stays there after the fix because it describes the
# inner tmux-256color terminfo, not the client. Applied at attach.
set -as terminal-features ",*:RGB"

# Synchronized output (DEC mode 2026): tmux wraps redraws in atomic frames,
# without which ghostty draws intermediate frames on split.
# NOTE: applied to the client at attach — a detach/reattach is needed after
# editing.
set -as terminal-features ",*:sync"

# NOTE: tmux has supported OSC 8 since 3.4 but forwards links only when the
# client declares the feature — otherwise `tmux info` shows "Hls: [missing]" and
# links arrive as plain text. Like sync, applied at attach.
set -as terminal-features ",*:hyperlinks"

# NOTE: DevPod's ssh transport mangles cud1=\n — the intermediate PTY translates
# NL→CRLF and the extra \r throws the cursor to column 0 on redraw, so panes
# overwrite each other. Only over ssh; `docker exec` and the mac are unaffected.
# Scoped to xterm-256color because every ssh/devpod connection collapses to it,
# while the local mac is xterm-ghostty. Source: loft-sh/devpod#932.
set -ga terminal-overrides ',xterm-256color:cud1=\E[1B'

# tmux-thumbs (flash-style labels over paths/hashes/URLs), installed through nix
# rather than TPM. prefix+f, then the letter copies the token over OSC52.
# NOTE: the @thumbs-* options must come BEFORE run-shell.
set -g @thumbs-key f
set -g @thumbs-osc52 1
set -g @thumbs-hint-fg-color '#cb4b16'   # the label letter (Solarized orange), like flash
set -g @thumbs-hint-bg-color 'default'
set -g @thumbs-fg-color '#268bd2'        # matches: Solarized blue, holds contrast in both themes
set -g @thumbs-bg-color 'default'
# copy silently on success; report only a failure
set -g @thumbs-command        'tmux set-buffer -- "{}" || tmux display-message "Copy failed"'
set -g @thumbs-upcase-command 'tmux set-buffer -- "{}" && tmux paste-buffer || tmux display-message "Copy failed"'
if-shell '[ -e ~/.nix-profile/share/tmux-plugins/tmux-thumbs/tmux-thumbs.tmux ]' \
  'run-shell ~/.nix-profile/share/tmux-plugins/tmux-thumbs/tmux-thumbs.tmux'
