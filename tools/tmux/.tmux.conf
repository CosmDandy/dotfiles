unbind r
bind-key -r r source-file ~/.tmux.conf

bind-key y select-pane -L
bind-key h select-pane -D
bind-key a select-pane -U
bind-key e select-pane -R

# Бесшовная навигация nvim-сплиты <-> tmux-пейны (vim-tmux-navigator).
# Если в активном пейне запущен (n)vim — пробрасываем Ctrl-клавишу внутрь
# (nvim прыгает по сплиту), иначе сам select-pane. Раскладка y/h/a/e.
# ВНИМАНИЕ: C-a/C-e/C-y в не-vim пейнах перехватываются здесь и больше не
# работают как readline begin/end-of-line/yank.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)$'"
bind-key -n 'C-y' if-shell "$is_vim" 'send-keys C-y' 'select-pane -L'
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -D'
bind-key -n 'C-a' if-shell "$is_vim" 'send-keys C-a' 'select-pane -U'
bind-key -n 'C-e' if-shell "$is_vim" 'send-keys C-e' 'select-pane -R'
bind-key -T copy-mode-vi 'C-y' select-pane -L
bind-key -T copy-mode-vi 'C-h' select-pane -D
bind-key -T copy-mode-vi 'C-a' select-pane -U
bind-key -T copy-mode-vi 'C-e' select-pane -R

# Split panes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# prefix+R — режим ресайза: дальше жмёшь y/h/a/e сколько нужно, Escape выходит.
# Раскладка та же, что у навигации (y/h/a/e = ←↓↑→), но двигает границу, а не фокус.
# Ось выбирать не надо: resize-pane -L/-R/-U/-D сам находит нужную границу в любой
# сетке, в том числе когда пейны разделены и вертикально, и горизонтально.
#
# Две неочевидности tmux, из-за которых это выглядит именно так:
# 1. Таблица сбрасывается в root ПОСЛЕ КАЖДОЙ клавиши — поэтому switch-client -T
#    resize повторяется в конце каждого бинда, иначе режим был бы одноразовым.
# 2. Любая непривязанная клавиша тоже выкидывает в root, И ПРИ ЭТОМ СЪЕДАЕТСЯ —
#    до пейна не доходит (проверено: в режиме нажать z → в шелл приходит пустота).
#    Значит забыл Escape — первый символ следующей команды пропадёт молча. Ради
#    этого индикатор в status-right красит #S и часы в оранжевый (см. ниже).
bind R switch-client -T resize
bind -T resize y resize-pane -L 3 \; switch-client -T resize
bind -T resize h resize-pane -D 3 \; switch-client -T resize
bind -T resize a resize-pane -U 3 \; switch-client -T resize
bind -T resize e resize-pane -R 3 \; switch-client -T resize
bind -T resize Escape display-message "resize off"

# prefix+j — пейн с запущенным Claude Code переезжает из своего окна в сплит
# справа от текущего и обратно (тот же процесс, join-pane/break-pane). Из nvim
# то же самое доступно как :ClaudeCode / <leader>ac через tmux-провайдер плагина.
bind j run-shell '~/.dotfiles/tools/tmux/claude-pane.sh toggle #{pane_id}'

# ============================================================================
# SESSION MANAGEMENT
# ============================================================================

# Create new session with prefix + S
bind S command-prompt -p "New session:" "new-session -A -s '%%'"

# Kill current session with prefix + X
bind X confirm-before -p "kill-session #S? (y/n)" kill-session

# Switch to last session with prefix + L
bind L switch-client -l

# prefix + s: динамическое меню сессий с прямым прыжком по горячей клавише.
bind s run-shell '~/.dotfiles/tools/tmux/session-menu.sh'

# Don't exit tmux when closing a session (switch to another instead)
set -g detach-on-destroy off

# Автоматическое именование новых сессий по названию директории
set-hook -g session-created "rename-session '#{s/^[.]//:#{b:pane_current_path}}'"

# SSH agent forwarding — update env on reattach
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

set -g prefix C-s
# мышь выключена (клавиатура-only); prefix+m — осознанный временный возврат
set -g mouse off
bind m set -g mouse \; display-message "mouse #{?mouse,on,off}"
set -g set-titles on
set -g set-titles-string '#(~/.dotfiles/tools/tmux/pane-title.sh #{pane_pid} #{pane_current_command} #S)'
set -g set-clipboard on
set -g allow-passthrough on
set -g history-limit 1000000

# ============================================================================
# NOTIFICATIONS
# ============================================================================

# Monitor activity in other windows
set -g monitor-activity off
set -g visual-activity off
set -g activity-action none

# Monitor bell signals in other windows (claude finish, long commands)
set -g monitor-bell on
set -g visual-bell off
set -g bell-action other
# afplay есть только на macOS. В Linux-контейнере безусловный хук форкал падающий
# процесс на каждый bell (claude/nvim) — micro-lag. Ставим хук только если afplay есть.
# Звук на bell намеренно НЕ здесь, а в Ghostty (bell-features audio,
# bell-audio-path = Submarine). Хук с afplay звучал бы только там, где afplay
# есть — то есть на Маке и никогда в dev-контейнере, хотя BEL из контейнера
# доходит до того же терминала. Озвучка на хосте покрывает оба случая одинаково,
# и заодно снимает форк процесса на каждый bell. За tmux остаётся подсветка
# окна: monitor-bell + window-status-bell-style ниже.
# Внимание: bell-action other — сигнал идёт только от НЕактивных окон. Это
# осознанно (смотришь в окно — звук не нужен), но означает, что в контейнере,
# где все события сводятся к BEL, активное окно молчит.

# for neovim
set -sg escape-time 0
set -g focus-events on

# VI mode
set-window-option -g mode-keys vi
set -g status-keys vi

# Дефолт tmux расходится с вимом: v = rectangle-toggle, а begin-selection висит
# на Space. Мышечная память из nvim из-за этого врёт — приводим к вим-семантике.
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Автоматическое завершение выделения (мышь, дабл/трипл-клик, y) копирует,
# но НЕ выходит из copy-mode — не кидает вниз на ввод.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi y                 send-keys -X copy-selection
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection

# Enter — осознанный выход из copy-mode вниз (и копирует, если есть выделение).
# Дополнительно: q, Escape и Ctrl-c тоже выходят.
bind -T copy-mode-vi Enter  send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# prefix+P — выгрузить скроллбек пейна в nvim. В copy-mode нет номеров строк, и
# на длинных выводах (трейсбек nix, лог) прицелиться нечем; в nvim есть V, поиск
# и фолды. Открываем на последней строке (+) — там свежая ошибка.
bind-key P run-shell 'tmux capture-pane -p -S -#{history_limit} -t #{pane_id} > /tmp/tmux-scrollback-#{pane_id}.txt; tmux new-window -n scrollback "nvim + /tmp/tmux-scrollback-#{pane_id}.txt"'

# Статус-бар
set -g status on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style bg=default

# Статус-бар (левая часть)
set -g status-left ''

# Статус-бар (правая часть) - показываем имя сессии и время
# Разделитель точкой, как в statusline Claude Code — чтобы обе строки читались
# одинаково.
# Три состояния. Проверка key-table идёт ПЕРВОЙ: войдя в режим, клиент уже не
# под префиксом, так что порядок веток тут не косметика.
# Цвет режима — colour136 (Solarized yellow #af8700), а НЕ оранжевый colour166:
# оранжевый сидит вплотную к красному colour9 у префикса, и боковым зрением они
# не различались. Жёлтый разведён по тону с обоими соседями. Взят приглушённый,
# а не colour11: яркий жёлтый нечитаем на светлой теме, а тема тут переключается
# (та же причина, по которой ниже у thumbs выбран Solarized accent).
set -g status-right '#{?#{==:#{client_key_table},resize},#[fg=colour136]#S #[fg=colour242]· #[fg=colour136]%H:%M ,#{?client_prefix,#[fg=colour9]#S #[fg=colour242]· #[fg=colour9]%H:%M ,#[fg=colour12]#S #[fg=colour242]· #[fg=default]%H:%M }}'

# Активное окно
set -g window-status-current-format " ●#{?#{||:#{==:#{window_index},3},#{||:#{==:#{window_index},6},#{==:#{window_index},9}}}, ,}"
set -g window-status-current-style fg=colour9,bg=default

# Неактивные окна
set -g window-status-format " ●#{?#{||:#{==:#{window_index},3},#{||:#{==:#{window_index},6},#{==:#{window_index},9}}}, ,}"
set -g window-status-style fg=colour242,bg=default

# Подсветка окон с bell (claude finish, long commands)
set -g window-status-bell-style fg=colour2,bg=default

# Разделитель панелей
set -g pane-border-style fg=colour242
set -g pane-active-border-style fg=colour166

# Сообщения
set -g message-style fg=colour166,bg=default

# Режим выделения (copy-mode) - инверсия цветов терминала
set -g mode-style reverse

# Переменование окон
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Terminal colors
set -g default-terminal "tmux-256color"
# terminal-features, а не terminal-overrides с маской "*256col*": снаружи tmux Ghostty
# ставит TERM=xterm-ghostty, под эту маску он не подходит, и оверрайд не применялся.
# Truecolor всё равно работал, но через Tc из terminfo, то есть строка была мёртвой на
# маке и жила только в контейнерах, где TERM схлопывается в xterm-256color. Маска "*"
# от имени TERM не зависит и единообразна с sync/hyperlinks ниже; применяется при attach.
# Проверять через `tmux display -p '#{client_termfeatures}'` — в списке должен быть RGB.
# НЕ по `tmux info`: там строка "RGB: [missing]" остаётся и после фикса, потому что
# описывает terminfo внутреннего tmux-256color, а не возможности клиента.
set -as terminal-features ",*:RGB"

# Synchronized output (DEC mode 2026): tmux оборачивает перерисовку панелей в atomic-кадры.
# Контейнерный TERM=xterm-256color НЕ несёт sync-cap (terminfo xterm-ghostty отсутствует),
# из-за чего ghostty рисует промежуточные/дублированные кадры при split. Фича применяется
# к клиенту в момент attach — после правки нужен detach/reattach сессии.
set -as terminal-features ",*:sync"

# OSC 8 гиперссылки (кликабельные ссылки в statusline Claude Code, выводе gh и
# прочих TUI). tmux умеет их с 3.4, но пробрасывает наружу только если у клиента
# объявлена фича — иначе `tmux info` показывает "Hls: [missing]" и ссылки
# приходят в терминал как обычный текст. Как и sync, применяется при attach.
set -as terminal-features ",*:hyperlinks"

# SSH-транспорт DevPod (local-docker, ssh-провайдер, remote, plain `ssh …devpod`) калечит
# cud1=\n: на промежуточном PTY ssh-сервера идёт NL→CRLF, лишний \r кидает курсор в колонку 0
# при перерисовке → панели затирают друг друга. Баг ТОЛЬКО по ssh (на Маке и через `docker exec`
# его нет). Меняем cursor-down на чистый CSI \E[1B, неуязвимый к NL-трансляции.
# Scope=xterm-256color: ВСЕ ssh/devpod-подключения сводятся к нему (в контейнере нет terminfo
# xterm-ghostty → .zshrc делает fallback на xterm-256color), а локальный Мак — xterm-ghostty,
# поэтому он НЕ затрагивается. Источник: loft-sh/devpod#932.
set -ga terminal-overrides ',xterm-256color:cud1=\E[1B'

# ============================================================================
# tmux-thumbs (flash-стиль: метки по путям/хешам/URL на экране) — ставится через
# nix (tmuxPlugins.tmux-thumbs), НЕ через TPM (TPM собирал бы rust через cargo).
# prefix+f → появляются буквы-метки, жмёшь букву → токен копируется. Копия через
# OSC52 (Ghostty + allow-passthrough), без xclip. Опции @thumbs-* ДО run-shell.
# ============================================================================
set -g @thumbs-key f
set -g @thumbs-osc52 1
# Цвета (hex или имена). Два слоя: match = само совпадение, hint = буква-метка.
set -g @thumbs-hint-fg-color '#cb4b16'   # буква-метка: жжёный оранжево-красный (Solarized orange), как flash
set -g @thumbs-hint-bg-color 'default'   # без плашки под буквой — только цвет символа
set -g @thumbs-fg-color '#268bd2'        # совпадения: Solarized blue (accent — держит контраст и в light, и в dark)
set -g @thumbs-bg-color 'default'        # фон совпадений: прозрачный (выделяем цветом текста, не плашкой)
# при успехе копируем тихо (set-buffer + OSC52, без «Copied»); сообщение — только при сбое
set -g @thumbs-command        'tmux set-buffer -- "{}" || tmux display-message "Copy failed"'
set -g @thumbs-upcase-command 'tmux set-buffer -- "{}" && tmux paste-buffer || tmux display-message "Copy failed"'
if-shell '[ -e ~/.nix-profile/share/tmux-plugins/tmux-thumbs/tmux-thumbs.tmux ]' \
  'run-shell ~/.nix-profile/share/tmux-plugins/tmux-thumbs/tmux-thumbs.tmux'
