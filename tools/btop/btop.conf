#? Config file for btop v.1.4.7

#* Only what differs from btop's defaults. The file used to be 283 lines, but a comparison
#* with Config::strings/ints/bools in v1.4.7 showed exactly six real differences — the
#* other 81 repeated the defaults byte for byte and hid the actual decisions.
#*
#* NOTE: it cannot grow back, because save_config_on_exit is false below, so btop does not
#* rewrite it on exit.

#* default 2000 ms; 500 makes a load spike visible instead of falling between frames
update_ms = 500

#* default false. Who spawned whom matters here (nix builds, agents, devpod).
proc_tree = true

#* default false. Base 10 matches how df, du and cloud dashboards show sizes.
base_10_sizes = true

#* default true. Auto-scaling the network graph jumps on every spike and makes neighbouring
#* frames impossible to compare by eye; false keeps the scale fixed.
net_auto = false

#* default "WARNING"; log only real errors
log_level = "ERROR"

#* NOTE: default true, and this is the key one for dotfiles — otherwise btop rewrites the
#* config on every exit and the file in the repository drifts from the one on disk by itself.
save_config_on_exit = false
