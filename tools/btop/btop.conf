#? Config file for btop v.1.4.7

#* Здесь только то, что отличается от умолчаний btop. Файл был на 283 строки, но
#* сверка с Config::strings/ints/bools из src/btop_config.cpp тега v1.4.7 показала,
#* что реально отличались ровно шесть значений — остальные 81 повторяли дефолт байт
#* в байт и лишь мешали увидеть настоящие решения.
#*
#* Раздуться обратно файл не может: save_config_on_exit = false (см. ниже), поэтому
#* btop при выходе его не перезаписывает. Полный список опций с описаниями —
#* `btop --help` и src/btop_config.cpp апстрима.

#* Дефолт 2000 мс. 500 — чтобы всплеск нагрузки был виден, а не проскакивал между кадрами.
update_ms = 500

#* Дефолт false. Дерево процессов: важно, кто кого породил (nix-сборки, агенты, devpod).
proc_tree = true

#* Дефолт false. Размеры в базе 10 — совпадает с тем, как их показывают df, du и облачные панели.
base_10_sizes = true

#* Дефолт true. Автомасштаб графика сети прыгает при каждом всплеске и мешает
#* сравнивать соседние кадры глазом; с false шкала фиксированная.
net_auto = false

#* Дефолт "WARNING". Логировать только настоящие ошибки.
log_level = "ERROR"

#* Дефолт true. Ключевое для dotfiles: без этого btop переписывает конфиг при каждом
#* выходе, и файл в репозитории расходится с тем, что лежит на диске, сам собой.
save_config_on_exit = false
