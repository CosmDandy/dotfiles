# Atuin — command history synced to a private server.
# Full option reference: https://docs.atuin.sh/configuration/config/

auto_sync = true
update_check = true
sync_address = "https://atuin.cosmdandy.dev"
sync_frequency = "30m"

search_mode = "fuzzy"
filter_mode = "host"
# history across the whole git tree instead of a single cwd — enables the "workspace"
# filter mode. Without it, history in a monorepo is torn apart by subdirectory.
workspaces = true
# after && || | append to the line instead of replacing it
command_chaining = true

style = "full"
inline_height = 0 # 0 = always fullscreen
# NOTE: the Up arrow is "peek at the last command", not a full search, so it gets its own
# compact height while fullscreen stays with Ctrl+R.
inline_height_shell_up_key_binding = 15
ctrl_n_shortcuts = true # ctrl+1..9 instead of alt for numeric shortcuts
show_help = false
show_tabs = false

# skip commands matching the default secret patterns (AWS, GH PAT, Slack, Stripe)
secrets_filter = true
# NOTE: do not record layout misses. A command starting with Cyrillic can never run — no
# binary in PATH has a Cyrillic name — while Cyrillic in arguments, paths and comments is
# still recorded, because it can only appear after the first token.
history_filter = ["^\\s*\\p{Cyrillic}"]
# Enter runs the command; Tab returns it to the shell for editing
enter_accept = true

[stats]
# Keep the top list about work, not about moving around and shell syntax. This only
# affects `atuin stats` — history and search still record everything.
ignored_commands = [
  # navigation and looking at things
  "cd",
  "..",
  "...",
  "....",
  ".....",
  "ls",
  "pwd",
  "cat",
  "vi",
  "clear",
  "exit",
  "source",
  "which",
  # shell syntax, not commands. A multi-line `while true; do ...` is split by newline,
  # so its continuation lines surface as separate "commands".
  "echo",
  "export",
  "eval",
  "true",
  "false",
  "while",
  "for",
  "if",
  "then",
  "else",
  "fi",
  "do",
  "done",
  "#",
  # same split, but for flags continuing an `ansible-playbook -e` / `curl -w` line
  "-e",
  "-w",
  # own aliases whose whole point is being too short to be worth a row
  "c",
  "e",
  "ds",
  "dpd",
  "v"
]
# Count the subcommand as part of the command, so `devpod up` and `devpod ssh` are separate
# rows rather than one lumped `devpod`.
# NOTE: this list REPLACES the upstream default entirely, so the whole upstream set is
# repeated here plus everything below.
# Only tools whose second token is a verb belong here. `ssh`, `ping`, `curl`, `scp` and the
# git-clone aliases take an argument there instead — listing them would shatter one row
# into one per host or repo.
